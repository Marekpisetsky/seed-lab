# Daily prices for wealth-lens.
#
# GitHub only runs workflows from .github/workflows/ at the root of the
# repository. Copy this file to .github/workflows/update-prices.yml once
# (see "Daily prices" in projects/wealth-lens/README.md), then start the first
# run from Actions → "Update prices" → "Run workflow".
#
# What it does: downloads the daily closes of src/data/instruments.json
# (Yahoo Finance, Stooq as fallback), writes public/data/, and commits only if
# something changed. A failed download keeps the previous data and never fails
# the job; the commit to master makes Vercel redeploy the site.

name: Update prices

on:
  schedule:
    - cron: "40 22 * * *" # every day at 22:40 UTC, after European and US markets close
  workflow_dispatch: # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/wealth-lens
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # 22.18+ runs the TypeScript script directly

      - name: Download closes
        run: node scripts/update-prices.mts

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update prices ($(date -u +%F))"
          git push || (git pull --rebase && git push)
